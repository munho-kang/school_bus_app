# main에 올리면 웹 버전을 빌드해서 GitHub Pages(https://munho-kang.github.io/school_bus_app/)에 배포한다.
name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: bus_tracker
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: node test/map_html_check.mjs
      - run: flutter build web --release --base-href /school_bus_app/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: bus_tracker/build/web
      - id: deployment
        uses: actions/deploy-pages@v4
