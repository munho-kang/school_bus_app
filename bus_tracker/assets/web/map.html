<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- 웹(srcdoc iframe)에선 location.protocol이 about:라 카카오 SDK가 http로 지도를 부른다. https 페이지에서 막히지 않게 자동으로 https로 바꾼다. -->
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>제주대학교 순환버스</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#f3f4f6;font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
#map{position:absolute;top:0;left:0;right:0;bottom:0}
.map-toast-container{position:absolute;top:12px;left:0;right:0;padding:0 16px;z-index:1001;pointer-events:none;display:flex;flex-direction:column;align-items:center}
.map-toast{position:relative;background:#fff;color:#222;padding:10px 32px 10px 16px;border-radius:8px;font-size:13px;text-align:left;margin-bottom:6px;opacity:0;transform:translateY(-10px);transition:opacity .3s,transform .3s;pointer-events:auto;box-shadow:0 4px 16px rgba(0,0,0,.12);border:1px solid #e5e7eb;max-width:90%}
.map-toast.show{opacity:1;transform:translateY(0)}
.map-toast-close{position:absolute;top:4px;right:4px;cursor:pointer;opacity:.5;font-size:18px;padding:2px 6px;border-radius:4px;transition:opacity .2s;color:#999}
.map-toast-close:hover{opacity:1}
.map-toast.error{border-color:rgba(244,67,54,.3);color:#f44336}
.map-toast.success{border-color:rgba(76,175,80,.3);color:#4caf50}
.map-refresh-btn{display:none;position:absolute;bottom:24px;right:16px;background:#fff;border:1px solid #e5e7eb;border-radius:50%;width:56px;height:56px;box-shadow:0 4px 16px rgba(0,0,0,.12);cursor:pointer;align-items:center;justify-content:center;color:#222;z-index:1000;-webkit-tap-highlight-color:transparent}
.map-refresh-btn svg{width:26px;height:26px}
.current-marker{position:relative;width:60px;height:60px;display:flex;align-items:center;justify-content:center}
.marker-circle{position:absolute;width:28px;height:28px;border-radius:50%;border:4px solid white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;color:white;z-index:10;animation:heartbeat 2s ease-in-out infinite}
.marker-circle.bus-a{background-color:#0066FF}
.marker-circle.bus-b{background-color:#00CC66}
.marker-circle.stopped{animation:none;background-color:#888!important;border-color:#ccc;opacity:.9}
.pulse-ring{position:absolute;width:28px;height:28px;border-radius:50%;border:1.5px solid;animation:pulse-wave 3s ease-out infinite;opacity:0}
.pulse-ring.stopped{animation:none;opacity:0}
@keyframes pulse-wave{0%{transform:scale(1);opacity:.25}100%{transform:scale(2.5);opacity:0}}
@keyframes heartbeat{0%{transform:scale(1)}7%{transform:scale(1.15)}14%{transform:scale(1)}21%{transform:scale(1.1)}28%,100%{transform:scale(1)}}
.station-marker{display:flex;flex-direction:column;align-items:center}
.station-marker.label-top{flex-direction:column-reverse}
.station-marker.label-bottom{flex-direction:column}
.station-bullet{border:2.5px solid white;border-radius:50%;box-shadow:0 3px 6px rgba(0,0,0,.4)}
.station-bullet.normal{width:8px;height:8px;background-color:#FFB3B3}
.station-bullet.major{width:10px;height:10px;background-color:#FF6B6B}
.station-bullet.important{width:10px;height:10px;background-color:#1976d2}
.station-label{white-space:nowrap;border-radius:10px;margin:5px 0}
.station-label.normal{padding:1px 4px;background:#fff;border:1px solid #aaa;font-size:10px;color:#222}
.station-label.major{padding:2px 6px;background:#fff;border:1.5px solid #FF6B6B;font-size:11px;font-weight:bold;color:#222}
.station-label.important{padding:2px 5px;background:#fff;border:1px solid #1976d2;font-size:11px;font-weight:bold;color:#1976d2}
.my-location{width:24px;height:24px;border-radius:50%;background:#1976d2;border:4px solid #fff;box-shadow:0 1px 8px rgba(0,0,0,.4)}
.route-arrow{width:16px;height:16px;pointer-events:none}
.station-marker{cursor:pointer}
.eta{position:relative;margin-bottom:12px;background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 4px 16px rgba(0,0,0,.18);font-size:13px;color:#222;white-space:nowrap}
.eta:after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
.eta b{display:block;font-size:14px;margin-bottom:6px}
.eta-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.eta-badge{width:20px;height:20px;border-radius:50%;color:#fff;font-weight:bold;font-size:12px;display:flex;align-items:center;justify-content:center}
.eta-live{color:#16a34a;font-size:11px;font-weight:bold}
</style>

<div id="map"></div>
<div class="map-toast-container" id="mapToastContainer"></div>
<button class="map-refresh-btn" id="mapRefreshBtn" onclick="location.reload()" title="새로고침">

</button>
<script>
// 카카오맵 SDK는 앱키가 등록한 도메인의 Referer에서만 동작한다.
// 앱(WebView)은 학교 도메인이라 학교 앱키로, 웹(iframe)은 등록해 둔 웹 도메인이라 웹 전용 앱키로 각각 직접 받는다.

  var WEB_KEY = '88f1930a97d933fdd0c40788655a1d11';  // 웹: munho-kang.github.io / localhost:8765 에 등록된 키
  var isWeb = typeof window.Ready === 'undefined' && window.parent !== window;
  var src = 'https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&appkey=' + (isWeb ? WEB_KEY : APP_KEY);

<script src="https://bus.jejunu.ac.kr/js/conf.js"></script>
<script>
var mapKakaoMap = null;
var mapBusMarkers = {};
var mapBusRouteShapes = [];
var mapStationMarkers = [];
var mapIsAnimationStopped = false;
var IMP_STATIONS = ['정문','학생회관','중앙도서관','교양동','학생생활관'];
var ARROW_GAP_M = 60;          // 버스 앞뒤 진행 방향 화살표 간격(m)
var LEG_MARGIN_M = 50;         // 서버는 정류장 50m 안에 들어오면 '그 정류장'으로 보므로, 구간 앞뒤로 이만큼 여유를 둔다
var ARROW_COUNT = 2;           // 버스 앞·뒤에 각각 그릴 화살표 개수
var LOOP_START = '해대1호관', LOOP_END = '해대1호관(서)';   // 순환 구간의 시작·끝 정류장
var routePaths = {};           // 노선별 진행 순서 경로 { A: {pts, cum}, B: {pts, cum} }

function initMap() {
  var container = document.getElementById('map');
  mapKakaoMap = new kakao.maps.Map(container, {
    center: new kakao.maps.LatLng(33.455213, 126.561459),
    level: 4
  });
  mapKakaoMap.setMaxLevel(5);   // 캠퍼스 전체가 한 화면에 들어오는 정도까지만 축소
  kakao.maps.event.addListener(mapKakaoMap, 'zoom_changed', updateStationVisibility);
  kakao.maps.event.addListener(mapKakaoMap, 'click', closeEta);
  drawBusRoute(window.BUS_ROUTE_DATA || (typeof BUS_ROUTE_DATA !== 'undefined' ? BUS_ROUTE_DATA : null));
}

function drawBusRoute(geojson) {
  if (!geojson || !geojson.features) return;
  var lines = [], stationPos = {};
  geojson.features.forEach(function(feature) {
    var geom = feature.geometry;
    var props = feature.properties || {};
    if (geom.type === 'LineString') {
      lines.push(geom.coordinates);
      var path = geom.coordinates.map(function(c) { return new kakao.maps.LatLng(c[1], c[0]); });
      var pl = new kakao.maps.Polyline({
        path: path,
        strokeWeight: (props['stroke-width'] || 2) * 2,
        strokeColor: props.stroke || '#FFB3B3',
        strokeOpacity: props['stroke-opacity'] || 0.7,
        strokeStyle: 'solid',
        zIndex: 1
      });
      pl.setMap(mapKakaoMap);
      mapBusRouteShapes.push(pl);
    } else if (geom.type === 'Polygon') {
      var pp = geom.coordinates[0].map(function(c) { return new kakao.maps.LatLng(c[1], c[0]); });
      var pg = new kakao.maps.Polygon({
        path: pp,
        strokeWeight: (props['stroke-width'] || 2) * 2,
        strokeColor: props.stroke || '#808080',
        strokeOpacity: props['stroke-opacity'] || 0.4,
        strokeStyle: 'solid',
        fillColor: props.fill || '#db3939',
        fillOpacity: (props['fill-opacity'] || 0.5) * 0.5,
        zIndex: 0.5
      });
      pg.setMap(mapKakaoMap);
      mapBusRouteShapes.push(pg);
    } else if (geom.type === 'Point') {
      var pos = new kakao.maps.LatLng(geom.coordinates[1], geom.coordinates[0]);
      var sname = feature.sname || '정류장';
      stationPos[sname] = geom.coordinates;
      var minZoom = props.minZoomLevel || 14;
      var labelPos = props.labelPosition || 'bottom';
      var sc = IMP_STATIONS.indexOf(sname) !== -1 ? 'important' : (minZoom >= 10 ? 'major' : 'normal');
      var lpc = labelPos === 'top' ? 'label-top' : 'label-bottom';
      var content = document.createElement('div');
      content.innerHTML = '<div class="station-marker ' + lpc + '"><div class="station-bullet ' + sc + '"></div><div class="station-label ' + sc + '">' + sname + '</div></div>';
      content.onclick = showEta.bind(null, sname, pos);
      var ov = new kakao.maps.CustomOverlay({
        position: pos, content: content, xAnchor: 0.5,
        yAnchor: labelPos === 'top' ? 1.0 : 0.0, zIndex: 5
      });
      mapStationMarkers.push({ overlay: ov, minZoomLevel: minZoom, name: sname });
      mapBusRouteShapes.push(ov);
    }
  });
  if (lines.length) buildRoutePaths(lines[0], stationPos);
  updateStationVisibility();
}

// ---------- 노선 진행 경로 ----------
// 좌표는 GeoJSON 순서 [lng, lat]. 캠퍼스 크기(수 km)에서는 평면 근사로 충분하다.
function distM(a, b) {
  var k = Math.PI / 180;
  var dx = (b[0] - a[0]) * k * Math.cos((a[1] + b[1]) / 2 * k), dy = (b[1] - a[1]) * k;
  return 6371000 * Math.sqrt(dx * dx + dy * dy);
}
// 방위각(도): 북=0, 동=90
function bearingDeg(a, b) {
  var k = Math.PI / 180;
  var dx = (b[0] - a[0]) * Math.cos((a[1] + b[1]) / 2 * k), dy = b[1] - a[1];
  return (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;
}
function nearestIndex(coords, pt) {
  var best = -1, bestD = Infinity;
  if (!pt) return best;
  coords.forEach(function(c, i) { var d = distM(c, pt); if (d < bestD) { bestD = d; best = i; } });
  return bestD <= 60 ? best : -1;
}
// 경로선(B노선 순서)을 [정문→해대1호관 진입, 순환, 해대1호관(서)→정문 복귀] 세 구간으로 나눈다.
// 정류장을 못 찾으면 전체를 순환 구간으로 본다.
function splitRoute(coords, stationPos) {
  var s = nearestIndex(coords, stationPos[LOOP_START]), e = nearestIndex(coords, stationPos[LOOP_END]);
  if (s < 0 || e < 0 || s >= e) return { out: [], loop: coords, back: [] };
  return { out: coords.slice(0, s + 1), loop: coords.slice(s, e + 1), back: coords.slice(e) };
}
// 경로선은 B노선 진행 순서로 그려져 있다. A노선은 진입·복귀 구간은 같고 순환 구간만 반대 방향.
function buildRoutePaths(coords, stationPos) {
  var p = splitRoute(coords, stationPos);
  routePaths.B = makePath(coords);
  routePaths.A = makePath(p.out.concat(p.loop.slice().reverse(), p.back));
  ['A', 'B'].forEach(function(id) {
    var st = routePaths[id].stations = {};
    Object.keys(stationPos).forEach(function(n) { st[n] = stationAlongs(routePaths[id], stationPos[n]); });
  });
}
function makePath(pts) {
  var cum = [0];
  for (var i = 1; i < pts.length; i++) cum.push(cum[i - 1] + distM(pts[i - 1], pts[i]));
  return { pts: pts, cum: cum };
}
// 구간 i(pts[i-1]→pts[i]) 위에서 pt에 가장 가까운 지점: { along: 경로 시작부터의 거리(m), dist: 구간까지의 거리(m) }
// lo~hi(along)를 주면 구간 중 그 범위 안에서만 찾는다.
function nearestOnSeg(path, i, pt, lo, hi) {
  var a = path.pts[i - 1], b = path.pts[i], k = Math.PI / 180, c0 = path.cum[i - 1], L = path.cum[i] - c0;
  var cx = Math.cos(a[1] * k) * 111320, cy = 110540;
  var px = (pt[0] - a[0]) * cx, py = (pt[1] - a[1]) * cy, bx = (b[0] - a[0]) * cx, by = (b[1] - a[1]) * cy;
  var L2 = bx * bx + by * by, t = L2 ? (px * bx + py * by) / L2 : 0;
  var tlo = lo == null || !L ? 0 : (lo - c0) / L, thi = hi == null || !L ? 1 : (hi - c0) / L;
  t = Math.max(tlo, Math.min(thi, t));
  return { along: c0 + t * L, dist: Math.sqrt(Math.pow(px - t * bx, 2) + Math.pow(py - t * by, 2)) };
}
// pt에서 가장 가까운 경로 위 지점. win=[시작 along, 길이]를 주면 그 구간 안에서만 찾는다(끝을 넘으면 처음으로 이어짐).
// 경로가 되돌아 나오는 곳(해대4호관 회차로, 정문 앞)은 한 구간 안에서도 두 길이 15m쯤 떨어져 나란하다. 그런 곳에서는
// 가까운 후보가 둘 생기므로, heading(버스가 실제로 움직인 방위)이 있으면 그 방향으로 가는 길을 고른다.
function projectOnPath(path, pt, win, heading) {
  var best = { along: 0, dist: Infinity }, total = path.cum[path.cum.length - 1], cands = [], cur = null;
  for (var i = 1; i < path.pts.length; i++) {
    var lo = path.cum[i - 1], hi = path.cum[i], ov = null;
    if (win) {
      // 이 구간을 한 바퀴(total) 앞뒤로 옮겨 보며 win과 겹치는 부분만 남긴다
      for (var k = -1; k <= 1 && !ov; k++) {
        var l = Math.max(lo + k * total, win[0]), h = Math.min(hi + k * total, win[0] + win[1]);
        if (l <= h) ov = [l - k * total, h - k * total];
      }
      if (!ov) { if (cur) { cands.push(cur); cur = null; } continue; }
      lo = ov[0]; hi = ov[1];
    }
    var r = nearestOnSeg(path, i, pt, lo, hi);
    if (r.dist < best.dist) best = r;
    // 25m 이내로 가까운, 잇닿은 구간들을 후보 하나로 묶는다
    if (r.dist <= 25) { if (!cur || r.dist < cur.dist) cur = r; }
    else if (cur) { cands.push(cur); cur = null; }
  }
  if (cur) cands.push(cur);
  if (heading == null || cands.length < 2) return best;
  var pick = null;
  cands.forEach(function(c) {
    var q = pointAt(path, c.along);
    var diff = q ? Math.abs(((q[2] - heading) % 360 + 540) % 360 - 180) : 999;   // 길의 방위와 진행 방위 차이
    if (diff <= 90 && (!pick || c.dist < pick.dist)) pick = c;
  });
  return pick || best;
}
// 버스의 경로 위 위치. bd에 마지막 위치를 기억해 두었다가 20m 이상 움직이면 진행 방위를 갱신한다(GPS 흔들림은 무시).
function locateBus(bd, path, fix, station, next) {
  var moved = bd.lastFix ? distM(bd.lastFix, fix) : 0;
  var heading = moved >= 20 ? bearingDeg(bd.lastFix, fix) : bd.heading;
  var prj = projectOnPath(path, fix, legWindow(path, station, next), heading);
  if (prj.dist > 80) return prj;                       // 경로 밖(위치 없음 등)이면 기억해 두지 않는다
  if (!bd.lastFix || moved >= 20) { bd.lastFix = fix; bd.heading = heading; }
  return prj;
}
// 정류장 pt가 경로 위 어디(들)에 있는지: 가까운(60m 이내) 구간끼리 묶고, 묶음마다 가장 가까운 지점의 along 목록
function stationAlongs(path, pt) {
  var res = [], cur = null;
  for (var i = 1; i < path.pts.length; i++) {
    var r = nearestOnSeg(path, i, pt);
    if (r.dist <= 60) { if (!cur || r.dist < cur.dist) cur = r; }
    else if (cur) { res.push(cur.along); cur = null; }
  }
  if (cur) res.push(cur.along);
  return res;
}
// 서버가 알려준 (현 정류장 → 다음 정류장) 구간을 경로 위 [시작 along, 길이]로 바꾼다. 못 찾으면 null.
// 정문~해대1호관의 진입로와 복귀로가 15m쯤 떨어져 나란히 있어, 위치만으로 고르면 GPS 오차로 반대편 길에 붙어
// 화살표가 거꾸로 뒤집히곤 한다. 그래서 서버가 판단한 구간 안에서만 위치를 찾는다.
function legWindow(path, station, next) {
  var s = path.stations && path.stations[station], n = path.stations && path.stations[next];
  if (!s || !n || station === next) return null;
  var total = path.cum[path.cum.length - 1], best = null;
  s.forEach(function(a1) { n.forEach(function(a2) {
    var len = (((a2 - a1) % total) + total) % total;
    if (len > 0 && (!best || len < best[1])) best = [a1, len];
  }); });
  return best && [best[0] - LEG_MARGIN_M, best[1] + 2 * LEG_MARGIN_M];
}
// 경로 시작부터 along(m) 떨어진 지점의 [lng, lat, bearing]. 끝을 넘으면 처음으로 이어진다(순환 노선).
function pointAt(path, along) {
  var total = path.cum[path.cum.length - 1];
  if (!total) return null;
  along = ((along % total) + total) % total;
  for (var i = 1; i < path.pts.length; i++) {
    if (along <= path.cum[i]) {
      var a = path.pts[i - 1], b = path.pts[i], seg = path.cum[i] - path.cum[i - 1];
      var t = seg ? (along - path.cum[i - 1]) / seg : 0;
      return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, bearingDeg(a, b)];
    }
  }
  return null;
}
function arrowHtml(color, bearing, faded) {
  var chevron = 'M4 10 L8 4 L12 10';
  return '<div class="route-arrow" style="transform:rotate(' + bearing.toFixed(1) + 'deg);opacity:' + (faded ? 0.45 : 1) + '">' +
    '<svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="' + chevron + '" stroke="#fff" stroke-width="5"/>' +
    '<path d="' + chevron + '" stroke="' + color + '" stroke-width="2.5"/></svg></div>';
}
// 버스 현 위치 앞·뒤로 ARROW_COUNT개씩 진행 방향 화살표를 그린다
function drawBusArrows(busId, pos, bus) {
  var bd = mapBusMarkers[busId], path = routePaths[busId];
  if (!path || !bus.isRecent || bus.status === 'waiting') return;   // 운행 쉬는 중(대기·다음 출발 전)엔 화살표 없음
  var prj = locateBus(bd, path, [pos.getLng(), pos.getLat()], bus.station, bus.nextStation);
  if (prj.dist > 80) return;   // 경로에서 너무 멀면(위치 없음 등) 그리지 않음
  var color = busId === 'A' ? '#0066FF' : '#00CC66';
  for (var k = -ARROW_COUNT; k <= ARROW_COUNT; k++) {
    if (k === 0) continue;
    var p = pointAt(path, prj.along + k * ARROW_GAP_M);
    if (!p) continue;
    // 지나온 쪽(k<0) 화살표는 흐리게 → 진행 방향이 한눈에 보인다
    var ov = new kakao.maps.CustomOverlay({ position: new kakao.maps.LatLng(p[1], p[0]), content: arrowHtml(color, p[2], k < 0), zIndex: 6 });
    ov.setMap(mapKakaoMap); bd.arrows.push(ov);
  }
}

// ---------- 정류장 도착 예정 ----------
// 정류장을 누르면 노선별로 다음 버스가 언제 오는지 말풍선으로 보여준다.
// 학교 버스 누리집과 같은 규칙: 정문 출발 후 정류장 하나마다 1분(BUS_STATION_LIST 순서).
// 운행 중인 버스는 지금 있는 정류장부터 센다. 시간표·쉬는 날 문구는 앱이 window.setSchedule로 넘겨준다.
// ponytail: 정류장당 1분 고정 — 실제 달린 속도로 보정하려면 여기서 경로 거리(routePaths)를 쓰면 된다.
var schedule = {}, offText = null, lastBuses = {}, eta = null;
window.setSchedule = function(deps, off) { schedule = deps; offText = off; renderEta(); };
function stationIndex(id, name) {
  var list = typeof BUS_STATION_LIST !== 'undefined' ? BUS_STATION_LIST[id] || [] : [];
  return list.slice(0, -1).indexOf(name);   // 마지막 '정문'은 돌아오는 곳이라 뺀다
}
function hhmm(min) { return String(Math.floor(min / 60)).padStart(2, '0') + ':' + String(min % 60).padStart(2, '0'); }
// 노선 id가 name 정류장에 다음에 도착하는 시각: { min: 몇 분 뒤, at: 'HH:MM', live: 실시간이면 true } 또는 쉬는 까닭 문자열
function nextArrival(id, name, bus, nowMin) {
  var i = stationIndex(id, name);
  if (i < 0) return null;
  if (offText) return offText;
  var j = bus && bus.isRecent && bus.status !== 'waiting' ? stationIndex(id, bus.station) : -1;   // 운행 중인 버스가 있는 정류장
  if (j >= 0 && j <= i) return { min: i - j, at: hhmm(nowMin + i - j), live: true };
  var deps = schedule[id] || [];
  for (var k = 0; k < deps.length; k++) {
    var t = +deps[k].slice(0, 2) * 60 + +deps[k].slice(3);
    // 운행 중인 버스가 이미 지나갔으면 다음 출발 편부터 본다
    if (j >= 0 ? t > nowMin : t + i >= nowMin) return { min: t + i - nowMin, at: hhmm(t + i), live: false };
  }
  return '운행 종료';
}
function etaText(r) {
  if (typeof r === 'string') return r;
  var when = r.min <= 0 ? '곧 도착' : r.min < 60 ? r.min + '분 후' : r.at + ' 도착';
  return when + (r.min > 0 && r.min < 60 ? ' · ' + r.at : '') + (r.live ? ' <span class="eta-live">실시간</span>' : '');
}
function showEta(name, pos, e) {
  if (e) e.stopPropagation();
  closeEta();
  eta = { name: name, overlay: new kakao.maps.CustomOverlay({ position: pos, content: '', xAnchor: 0.5, yAnchor: 1, zIndex: 20 }),
          timer: setInterval(renderEta, 10000) };   // 열어 둔 동안 '몇 분 후'를 새로 센다
  renderEta();
  eta.overlay.setMap(mapKakaoMap);
}
function closeEta() { if (eta) { eta.overlay.setMap(null); clearInterval(eta.timer); } eta = null; }
function renderEta() {
  if (!eta) return;
  var d = new Date(), nowMin = d.getHours() * 60 + d.getMinutes(), rows = '';
  ['A', 'B'].forEach(function(id) {
    var r = nextArrival(id, eta.name, lastBuses[id], nowMin);
    if (r) rows += '<div class="eta-row"><span class="eta-badge" style="background:' + (id === 'A' ? '#0066FF' : '#00CC66') + '">' + id + '</span>' + etaText(r) + '</div>';
  });
  eta.overlay.setContent('<div class="eta"><b>' + eta.name + '</b>' + (rows || '도착 정보 없음') + '</div>');
}

// ---------- 내 위치 ----------
// 위치는 앱(Flutter)이 권한을 받아 window.showMyLocation(lat, lng, accuracy)로 넘겨준다.
var myLoc = null, myDot = null, myRing = null;
window.showMyLocation = function(lat, lng, acc) {
  myLoc = [lat, lng, Math.min(acc || 0, 150)];
  drawMyLocation();
};
// '내 위치' 버튼: 내 위치로 지도를 옮긴다.
window.centerMyLocation = function() {
  if (!mapKakaoMap || !myLoc) return;
  mapKakaoMap.panTo(new kakao.maps.LatLng(myLoc[0], myLoc[1]));
};
function drawMyLocation() {
  if (!mapKakaoMap || !myLoc) return;
  var pos = new kakao.maps.LatLng(myLoc[0], myLoc[1]);
  if (!myDot) {
    myRing = new kakao.maps.Circle({ center: pos, radius: myLoc[2], strokeWeight: 1, strokeColor: '#1976d2', strokeOpacity: 0.5, fillColor: '#1976d2', fillOpacity: 0.12, zIndex: 3 });
    myRing.setMap(mapKakaoMap);
    myDot = new kakao.maps.CustomOverlay({ position: pos, content: '<div class="my-location"></div>', zIndex: 9 });
    myDot.setMap(mapKakaoMap);
  } else {
    myDot.setPosition(pos); myRing.setPosition(pos); myRing.setRadius(myLoc[2]);
  }
}

function updateStationVisibility() {
  var z = mapKakaoMap.getLevel();
  mapStationMarkers.forEach(function(m) {
    m.overlay.setMap(z <= m.minZoomLevel ? mapKakaoMap : null);
  });
}

function updateBusMarkers(buses) {
  if (!buses) return;
  buses.forEach(function(bus) {
    var busId = bus.busId;
    var pos = new kakao.maps.LatLng(bus.latitude, bus.longitude);
    if (mapBusMarkers[busId]) {
      clearBusMarker(busId);
    } else {
      mapBusMarkers[busId] = { position: pos, marker: null, arrows: [] };
    }
    mapBusMarkers[busId].position = pos;
    createBusMarker(busId, pos);
    drawBusArrows(busId, pos, bus);
  });
}

function createBusMarker(busId, pos) {
  var cls = busId === 'A' ? 'bus-a' : 'bus-b';
  var rc = busId === 'A' ? '#0066FF' : '#00CC66';
  var sc = mapIsAnimationStopped ? ' stopped' : '';
  var content = '<div class="current-marker"><div class="pulse-ring' + sc + '" style="border-color:' + rc + '"></div><div class="marker-circle ' + cls + sc + '">' + busId + '</div></div>';
  var marker = new kakao.maps.CustomOverlay({ position: pos, content: content, zIndex: 10 });
  marker.setMap(mapKakaoMap);
  mapBusMarkers[busId].marker = marker;
}

function clearBusMarker(busId) {
  var bd = mapBusMarkers[busId];
  if (bd.marker) bd.marker.setMap(null);
  bd.arrows.forEach(function(a) { a.setMap(null); }); bd.arrows = [];
}

function showToast(msg, type, duration) {
  var c = document.getElementById('mapToastContainer');
  if (!c) return;
  var t = document.createElement('div');
  t.className = 'map-toast' + (type ? ' ' + type : '');
  t.textContent = msg;
  var cl = document.createElement('span');
  cl.className = 'map-toast-close';
  cl.textContent = '×';
  cl.onclick = function() { t.classList.remove('show'); setTimeout(function(){ t.remove(); }, 300); };
  t.appendChild(cl);
  c.appendChild(t);
  setTimeout(function() { t.classList.add('show'); }, 10);
  if (duration > 0) setTimeout(function() { t.classList.remove('show'); setTimeout(function(){ t.remove(); }, 300); }, duration);
}

function stopAnimations() {
  mapIsAnimationStopped = true;
  document.querySelectorAll('.marker-circle').forEach(function(e){ e.classList.add('stopped'); });
  document.querySelectorAll('.pulse-ring').forEach(function(e){ e.classList.add('stopped'); });
  var b = document.getElementById('mapRefreshBtn'); if (b) b.style.display = 'flex';
}

function startAnimations() {
  mapIsAnimationStopped = false;
  document.querySelectorAll('.marker-circle').forEach(function(e){ e.classList.remove('stopped'); });
  document.querySelectorAll('.pulse-ring').forEach(function(e){ e.classList.remove('stopped'); });
  var b = document.getElementById('mapRefreshBtn'); if (b) b.style.display = 'none';
}

kakao.maps.load(function() {
  initMap();
  drawMyLocation();
  if (window.Ready) window.Ready.postMessage('1');                        // 휴대폰 앱
  else if (window.parent !== window) window.parent.postMessage('bus-map-ready', '*');  // 웹(iframe)
});

window.receiveBusUpdate = function(jsonStr) {
  var buses = typeof jsonStr === 'string' ? JSON.parse(jsonStr) : jsonStr;
  if (!buses || buses.length === 0) {
    stopAnimations();
    showToast('버스를 찾을 수 없습니다. 잠시 후 새로고침을 시도하세요.', 'error', 5000);
    return;
  }
  startAnimations();
  updateBusMarkers(buses);
  buses.forEach(function(b) { lastBuses[b.busId] = b; });
  renderEta();
};
</script>
</body>
</html>
